<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de tablas de multiplicar</title>
</head>
<body>
    <script>
        function validarNumero(valor) {
            return Number.isInteger(valor) && valor > 0;
        }

        function generarTabla(numero, limite) {
            for (let multiplicador = 1; multiplicador <= limite; multiplicador++) {
                console.log(numero + ' x ' + multiplicador + ' = ' + numero * multiplicador);
            }
        }

        const numero = Number(prompt('Ingrese el numero para generar su tabla:'));
        const limite = Number(prompt('Ingrese hasta que numero desea multiplicar:'));

        if (validarNumero(numero) && validarNumero(limite)) {
            generarTabla(numero, limite);
        } else {
            console.log('Error: ambos valores deben ser numeros enteros positivos.');
        }
    </script>
</body>
</html>
