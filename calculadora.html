<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function tablaMultiplicar(num) {
            let i = 1
            while (i <= 10) {
                console.log(num + ' x ' + i + ' = ' + num * i)
                i++
            }
        }

        function pedirNumeros() {
            limite = Number(prompt('Ingrese la cantidad de nros a multiplicar'))
            let i = 1
            while (i <= limite) {
                num = Number(prompt('Ingrese un nro para multiplicar'))
                tablaMultiplicar(num)
                i++
            }
        }
pedirNumeros()





    </script>
</body>

</html>
