<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar contraseña</title>
</head>
<body>
    <script>
        function validarPassword(password) {
            return password !== null && password.length >= 8;
        }

        let intentos = 0;
        let passwordValida = false;

        while (intentos < 3 && !passwordValida) {
            let password = prompt('Ingrese una contraseña de al menos 8 caracteres:');
            intentos++;
            passwordValida = validarPassword(password);

            if (passwordValida) {
                console.log('La contraseña es válida.');
            } else {
                console.log('La contraseña no cumple los requisitos. Debe contener al menos 8 caracteres.');
            }
        }

        if (!passwordValida) {
            console.log('Se agotaron los tres intentos.');
        }
    </script>
</body>
</html>
