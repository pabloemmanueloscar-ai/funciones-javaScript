      <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar contraseña</title>
</head>
<body>
    <script>
        function validarPassword(password) {
            if (password === null) {
                return false;
            }

            if (password.length >= 8) {
                return true;
            } else {
                return false;
            }
        }

        let intentos = 0;
        let passwordValida = false;

        while (intentos < 3 && passwordValida === false) {
            let password = prompt('Ingrese una contraseña de al menos 8 caracteres:');
            intentos = intentos + 1;
            passwordValida = validarPassword(password);

            if (passwordValida === true) {
                console.log('La contraseña es válida.');
            } else {
                console.log('La contraseña no es válida.');
            }
        }

        if (passwordValida === false) {
            console.log('Se agotaron los tres intentos.');
        }
    </script>
</body>
